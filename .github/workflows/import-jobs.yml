name: Import production jobs

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: production-job-import
  cancel-in-progress: true

jobs:
  import-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Run protected production importer
        env:
          IMPORT_API_KEY: ${{ secrets.IMPORT_API_KEY }}
        run: |
          if [ -z "${IMPORT_API_KEY}" ]; then
            echo "Required importer credential is not configured." >&2
            exit 1
          fi

          curl \
            --request POST \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            --retry-connrefused \
            --header "X-Import-Key: ${IMPORT_API_KEY}" \
            https://gulf-jobs-api.onrender.com/run-import
